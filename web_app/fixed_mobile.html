<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f5f5f5;
            text-align: center;
        }
        .card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            margin: 10px 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        button {
            background: #4CAF50;
            color: white;
            padding: 15px;
            font-size: 18px;
            border: none;
            border-radius: 12px;
            width: 100%;
            margin: 10px 0;
            cursor: pointer;
        }
        .info {
            background: #e8f5e9;
            padding: 15px;
            border-radius: 12px;
            margin: 10px 0;
            font-size: 14px;
        }
        .debug {
            background: #f0f0f0;
            padding: 10px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 12px;
            text-align: left;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <h1>📱 МОБИЛЬНЫЙ ТЕСТ</h1>
    
    <div class="card">
        <div id="status" class="info">⏳ Проверка...</div>
        <div id="userInfo" class="info"></div>
        
        <input type="text" id="testMsg" placeholder="Тестовое сообщение" style="width:100%; padding:10px; margin:10px 0; border:1px solid #ddd; border-radius:8px;">
        
        <button onclick="sendData()">📤 ОТПРАВИТЬ</button>
        <button onclick="closeApp()">❌ ЗАКРЫТЬ</button>
        
        <div id="debugLog" class="debug">
            📋 Лог отправок:<br>
        </div>
    </div>
    
    <script>
        // Инициализация
        const tg = Telegram.WebApp;
        tg.expand();
        tg.ready();
        
        const user = tg.initDataUnsafe?.user;
        const statusDiv = document.getElementById('status');
        const userInfoDiv = document.getElementById('userInfo');
        const debugLog = document.getElementById('debugLog');
        
        function addLog(msg) {
            debugLog.innerHTML += `<br>${new Date().toLocaleTimeString()}: ${msg}`;
            console.log(msg);
        }
        
        addLog('Скрипт загружен');
        
        if (user) {
            statusDiv.innerHTML = '✅ Web App РАБОТАЕТ!';
            statusDiv.style.background = "#e8f5e9";
            userInfoDiv.innerHTML = `
                👤 Имя: ${user.first_name}<br>
                🆔 ID: ${user.id}<br>
                📱 Версия: ${tg.version}<br>
                📊 initData: ${tg.initData ? 'есть' : 'нет'}<br>
                🔑 initDataUnsafe: ${tg.initDataUnsafe ? 'есть' : 'нет'}
            `;
            addLog(`Пользователь: ${user.first_name} (ID: ${user.id})`);
        } else {
            statusDiv.innerHTML = '❌ Нет пользователя!';
            statusDiv.style.background = "#ffebee";
            userInfoDiv.innerHTML = '⚠️ Откройте через кнопку бота';
            addLog('ОШИБКА: Нет данных пользователя');
        }
        
        function sendData() {
            addLog('sendData() вызвана');
            
            if (!user) {
                addLog('❌ Нет пользователя, отправка невозможна');
                tg.showAlert('Ошибка: Нет данных пользователя!');
                return;
            }
            
            const testMessage = document.getElementById('testMsg').value || 'Тест с телефона';
            
            const data = {
                user_id: user.id,
                user_name: user.first_name,
                message: testMessage,
                timestamp: new Date().toISOString(),
                phone_test: true,
                random_id: Math.random().toString(36).substring(7)
            };
            
            const jsonData = JSON.stringify(data);
            addLog(`Отправляем: ${jsonData.substring(0, 100)}...`);
            
            try {
                // Отправляем
                tg.sendData(jsonData);
                addLog('✅ sendData() выполнен успешно');
                tg.showAlert('✅ Отправлено! Проверьте консоль бота');
                
                // Не закрываем сразу, чтобы пользователь увидел
                setTimeout(() => {
                    addLog('Закрываем приложение');
                    tg.close();
                }, 2000);
                
            } catch (e) {
                addLog(`❌ Ошибка: ${e.message}`);
                tg.showAlert('Ошибка: ' + e.message);
            }
        }
        
        function closeApp() {
            addLog('Закрытие приложения');
            tg.close();
        }
        
        // Main Button
        tg.MainButton.setText("ОТПРАВИТЬ");
        tg.MainButton.onClick(sendData);
        tg.MainButton.show();
        addLog('Main Button настроен');
        
        addLog('Готов к работе!');
    </script>
</body>
</html>
