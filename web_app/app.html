<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--tg-theme-bg-color, #f5f5f5);
            padding: 16px;
            min-height: 100vh;
            padding-bottom: 80px;
        }
        
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        
        .header {
            background: var(--tg-theme-secondary-bg-color, white);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        
        .user-info {
            background: #e8f5e9;
            border-radius: 12px;
            padding: 12px;
            margin: 10px 0;
            font-size: 14px;
            color: #2e7d32;
        }
        
        .section {
            background: var(--tg-theme-secondary-bg-color, white);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        
        .section h3 {
            font-size: 18px;
            margin-bottom: 12px;
            color: var(--tg-theme-text-color, #1a2b3c);
            border-left: 4px solid #4CAF50;
            padding-left: 12px;
        }
        
        .row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        
        .input-group {
            flex: 1;
            min-width: 100px;
        }
        
        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 12px;
            font-size: 16px;
            background: var(--tg-theme-bg-color, white);
            -webkit-appearance: none;
            appearance: none;
        }
        
        input:focus {
            outline: none;
            border-color: #4CAF50;
        }
        
        button {
            width: 100%;
            padding: 16px;
            font-size: 18px;
            font-weight: 600;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            margin-top: 10px;
        }
        
        .btn-primary {
            background: #4CAF50;
            color: white;
        }
        
        .btn-secondary {
            background: #f44336;
            color: white;
        }
        
        .valve-card {
            background: var(--tg-theme-bg-color, #f9f9f9);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 12px;
        }
        
        .valve-title {
            font-weight: bold;
            margin-bottom: 10px;
            color: #4CAF50;
        }
        
        /* Fix for mobile */
        @media (max-width: 480px) {
            body {
                padding: 12px;
            }
            .row {
                flex-direction: column;
                gap: 8px;
            }
            .input-group {
                min-width: auto;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌱 Мониторинг теплицы</h1>
            <div id="userInfo" class="user-info">⏳ Загрузка...</div>
        </div>
        
        <div class="section">
            <h3>🌡️ Температура (°C)</h3>
            <div class="row">
                <div class="input-group"><input type="number" id="temp_day" placeholder="День" step="0.1"></div>
                <div class="input-group"><input type="number" id="temp_night" placeholder="Ночь" step="0.1"></div>
            </div>
            <div class="row">
                <div class="input-group"><input type="number" id="temp_avg" placeholder="Средняя" step="0.1"></div>
                <div class="input-group"><input type="number" id="temp_max" placeholder="Макс" step="0.1"></div>
                <div class="input-group"><input type="number" id="temp_min" placeholder="Мин" step="0.1"></div>
            </div>
        </div>
        
        <div class="section">
            <h3>💧 Влажность (%)</h3>
            <div class="row">
                <div class="input-group"><input type="number" id="hum_day" placeholder="День"></div>
                <div class="input-group"><input type="number" id="hum_night" placeholder="Ночь"></div>
            </div>
            <div class="row">
                <div class="input-group"><input type="number" id="hum_avg" placeholder="Средняя"></div>
                <div class="input-group"><input type="number" id="hum_max" placeholder="Макс"></div>
                <div class="input-group"><input type="number" id="hum_min" placeholder="Мин"></div>
            </div>
        </div>
        
        <div class="section">
            <h3>🚰 Параметры раствора</h3>
            <div id="valvesContainer"></div>
        </div>
        
        <div class="section">
            <h3>📝 Заметки</h3>
            <textarea id="notes" rows="2" placeholder="Дополнительные наблюдения..."></textarea>
        </div>
        
        <button class="btn-primary" id="sendBtn">📤 ОТПРАВИТЬ ОТЧЕТ</button>
        <button class="btn-secondary" id="closeBtn">❌ ЗАКРЫТЬ</button>
    </div>
    
    <script>
        // Обработка ошибок WebView
        window.addEventListener('error', function(e) {
            console.log('Caught error:', e.message);
        });
        
        // Инициализация Telegram Web App
        let tg;
        try {
            tg = window.Telegram.WebApp;
            tg.expand();
            tg.ready();
        } catch(e) {
            console.error('Telegram init error:', e);
            document.getElementById('userInfo').innerHTML = '❌ Ошибка инициализации';
        }
        
        const user = tg?.initDataUnsafe?.user;
        const userInfo = document.getElementById('userInfo');
        
        if (user) {
            userInfo.innerHTML = `✅ Пользователь: ${user.first_name}<br>🆔 ID: ${user.id}`;
        } else {
            userInfo.innerHTML = '❌ Откройте через кнопку в боте';
        }
        
        // Создаем поля для 4 клапанов
        const valvesContainer = document.getElementById('valvesContainer');
        for (let i = 1; i <= 4; i++) {
            const valveDiv = document.createElement('div');
            valveDiv.className = 'valve-card';
            valveDiv.innerHTML = `
                <div class="valve-title">🚰 Клапан ${i}</div>
                <div class="row">
                    <div class="input-group"><input type="number" id="ec_${i}" placeholder="EC" step="0.1"></div>
                    <div class="input-group"><input type="number" id="ph_${i}" placeholder="pH" step="0.1"></div>
                    <div class="input-group"><input type="number" id="drain_${i}" placeholder="Дренаж %"></div>
                </div>
            `;
            valvesContainer.appendChild(valveDiv);
        }
        
        function sendReport() {
            if (!user) {
                tg?.showAlert('Ошибка: Нет данных пользователя');
                return;
            }
            
            const reportData = {
                user_id: user.id,
                user_name: user.first_name,
                timestamp: new Date().toISOString(),
                temperature: {
                    day: parseFloat(document.getElementById('temp_day')?.value) || null,
                    night: parseFloat(document.getElementById('temp_night')?.value) || null,
                    avg: parseFloat(document.getElementById('temp_avg')?.value) || null,
                    max: parseFloat(document.getElementById('temp_max')?.value) || null,
                    min: parseFloat(document.getElementById('temp_min')?.value) || null
                },
                humidity: {
                    day: parseFloat(document.getElementById('hum_day')?.value) || null,
                    night: parseFloat(document.getElementById('hum_night')?.value) || null,
                    avg: parseFloat(document.getElementById('hum_avg')?.value) || null,
                    max: parseFloat(document.getElementById('hum_max')?.value) || null,
                    min: parseFloat(document.getElementById('hum_min')?.value) || null
                },
                valves: [],
                notes: document.getElementById('notes')?.value || ''
            };
            
            for (let i = 1; i <= 4; i++) {
                reportData.valves.push({
                    valve: i,
                    ec: parseFloat(document.getElementById(`ec_${i}`)?.value) || null,
                    ph: parseFloat(document.getElementById(`ph_${i}`)?.value) || null,
                    drain: parseFloat(document.getElementById(`drain_${i}`)?.value) || null
                });
            }
            
            try {
                tg.sendData(JSON.stringify(reportData));
                tg.showAlert('✅ Отчет отправлен!');
                setTimeout(() => tg.close(), 1500);
            } catch(e) {
                console.error('Send error:', e);
                tg.showAlert('❌ Ошибка: ' + e.message);
            }
        }
        
        document.getElementById('sendBtn').onclick = sendReport;
        document.getElementById('closeBtn').onclick = () => tg?.close();
        
        tg?.MainButton?.setText("ОТПРАВИТЬ");
        tg?.MainButton?.onClick(sendReport);
        tg?.MainButton?.show();
    </script>
</body>
</html>
