<script>
    const tg = window.Telegram.WebApp;
    tg.ready();

    document.getElementById('mainBtn').onclick = async function() {
        const user = tg.initDataUnsafe?.user;
        const payload = {
            user_id: user?.id,
            user_name: user?.first_name || "Пользователь",
            temp: { d: document.getElementById('td').value, n: document.getElementById('tn').value },
            hum: { d: document.getElementById('hd').value, n: document.getElementById('hn').value },
            notes: document.getElementById('notes').value
        };

        // 1. Пытаемся отправить данные на ваш сервер напрямую (работает везде)
        try {
            const response = await fetch('http://ВАШ_IP_ИЛИ_ДОМЕН:8000/submit_report', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            
            if (response.ok) {
                tg.showAlert("✅ Отчет успешно отправлен через API!");
                tg.close();
                return;
            }
        } catch (e) {
            console.log("Сервер недоступен, пробуем стандартный метод...");
        }

        // 2. Если сервер недоступен, пробуем стандартный sendData (только для кнопок меню)
        try {
            tg.sendData(JSON.stringify(payload));
        } catch (e) {
            alert("Ошибка: Используйте кнопку в меню бота!");
        }
    };
</script>
