<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        body {
            background: var(--tg-theme-bg-color, #f0f2f5);
            padding: 16px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding-bottom: 30px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 20px;
            padding: 20px;
            background: linear-gradient(135deg, #2e7d32, #4caf50);
            border-radius: 20px;
            color: white;
        }
        
        .header h1 {
            font-size: 22px;
            margin-bottom: 8px;
        }
        
        .header p {
            font-size: 14px;
            opacity: 0.9;
        }
        
        .date-info {
            background: rgba(255,255,255,0.2);
            padding: 8px;
            border-radius: 12px;
            margin-top: 12px;
            font-size: 14px;
        }
        
        .section {
            background: var(--tg-theme-secondary-bg-color, white);
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        
        .section h2 {
            font-size: 18px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-left: 4px solid #4caf50;
            padding-left: 12px;
            color: var(--tg-theme-text-color, #1a2b3c);
        }
        
        .subsection {
            margin-bottom: 20px;
            padding: 12px;
            background: var(--tg-theme-bg-color, #f8f9fa);
            border-radius: 12px;
        }
        
        .subsection h3 {
            font-size: 16px;
            margin-bottom: 12px;
            color: #4caf50;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 16px;
        }
        
        .input-group {
            margin-bottom: 12px;
        }
        
        .input-group label {
            display: block;
            margin-bottom: 4px;
            font-size: 12px;
            font-weight: 500;
            color: var(--tg-theme-text-color, #555);
        }
        
        .input-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 14px;
            background: var(--tg-theme-bg-color, white);
        }
        
        .input-group input:focus {
            outline: none;
            border-color: #4caf50;
        }
        
        .valve-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 8px;
        }
        
        .valve-card {
            background: var(--tg-theme-secondary-bg-color, #fff);
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 12px;
        }
        
        .valve-title {
            font-weight: bold;
            margin-bottom: 10px;
            text-align: center;
            color: #2e7d32;
        }
        
        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }
        
        .submit-btn {
            flex: 1;
            background: #4caf50;
            color: white;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        
        .cancel-btn {
            flex: 1;
            background: #f44336;
            color: white;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        
        @media (max-width: 480px) {
            .stats-grid, .valve-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌱 Мониторинг теплицы</h1>
            <p>Ежедневный отчет о параметрах</p>
            <div class="date-info" id="dateInfo">📅 Загрузка...</div>
        </div>

        <form id="monitoringForm">
            <!-- ========== ТЕМПЕРАТУРА ========== -->
            <div class="section">
                <h2>🌡️ Температура (°C)</h2>
                <div class="stats-grid">
                    <div class="input-group"><label>🌞 День</label><input type="number" id="temp_day" step="0.1" placeholder="24.5"></div>
                    <div class="input-group"><label>🌙 Ночь</label><input type="number" id="temp_night" step="0.1" placeholder="18.0"></div>
                    <div class="input-group"><label>📊 Средняя</label><input type="number" id="temp_avg" step="0.1" placeholder="21.2"></div>
                    <div class="input-group"><label>⬆️ Макс</label><input type="number" id="temp_max" step="0.1" placeholder="26.0"></div>
                    <div class="input-group"><label>⬇️ Мин</label><input type="number" id="temp_min" step="0.1" placeholder="16.5"></div>
                </div>
            </div>

            <!-- ========== ВЛАЖНОСТЬ ========== -->
            <div class="section">
                <h2>💧 Влажность (%)</h2>
                <div class="stats-grid">
                    <div class="input-group"><label>🌞 День</label><input type="number" id="hum_day" step="1" placeholder="65"></div>
                    <div class="input-group"><label>🌙 Ночь</label><input type="number" id="hum_night" step="1" placeholder="80"></div>
                    <div class="input-group"><label>📊 Средняя</label><input type="number" id="hum_avg" step="1" placeholder="72"></div>
                    <div class="input-group"><label>⬆️ Макс</label><input type="number" id="hum_max" step="1" placeholder="85"></div>
                    <div class="input-group"><label>⬇️ Мин</label><input type="number" id="hum_min" step="1" placeholder="60"></div>
                </div>
            </div>

            <!-- ========== ПАРАМЕТРЫ РАСТВОРА (4 клапана) ========== -->
            <div class="section">
                <h2>💦 Параметры раствора (4 клапана)</h2>
                <div class="valve-grid" id="valves-container">
                    <!-- Клапан 1 -->
                    <div class="valve-card"><div class="valve-title">🚰 Клапан 1</div>
                        <div class="input-group"><label>EC (mS/cm)</label><input type="number" id="ec_1" step="0.1" placeholder="2.5"></div>
                        <div class="input-group"><label>pH</label><input type="number" id="ph_1" step="0.1" min="0" max="14" placeholder="6.2"></div>
                        <div class="input-group"><label>Дренаж %</label><input type="number" id="drain_1" step="1" min="0" max="100" placeholder="30"></div>
                    </div>
                    <!-- Клапан 2 -->
                    <div class="valve-card"><div class="valve-title">🚰 Клапан 2</div>
                        <div class="input-group"><label>EC (mS/cm)</label><input type="number" id="ec_2" step="0.1" placeholder="2.4"></div>
                        <div class="input-group"><label>pH</label><input type="number" id="ph_2" step="0.1" min="0" max="14" placeholder="6.1"></div>
                        <div class="input-group"><label>Дренаж %</label><input type="number" id="drain_2" step="1" min="0" max="100" placeholder="28"></div>
                    </div>
                    <!-- Клапан 3 -->
                    <div class="valve-card"><div class="valve-title">🚰 Клапан 3</div>
                        <div class="input-group"><label>EC (mS/cm)</label><input type="number" id="ec_3" step="0.1" placeholder="2.6"></div>
                        <div class="input-group"><label>pH</label><input type="number" id="ph_3" step="0.1" min="0" max="14" placeholder="6.3"></div>
                        <div class="input-group"><label>Дренаж %</label><input type="number" id="drain_3" step="1" min="0" max="100" placeholder="32"></div>
                    </div>
                    <!-- Клапан 4 -->
                    <div class="valve-card"><div class="valve-title">🚰 Клапан 4</div>
                        <div class="input-group"><label>EC (mS/cm)</label><input type="number" id="ec_4" step="0.1" placeholder="2.5"></div>
                        <div class="input-group"><label>pH</label><input type="number" id="ph_4" step="0.1" min="0" max="14" placeholder="6.2"></div>
                        <div class="input-group"><label>Дренаж %</label><input type="number" id="drain_4" step="1" min="0" max="100" placeholder="29"></div>
                    </div>
                </div>
            </div>

            <!-- Заметки -->
            <div class="section">
                <h2>📝 Заметки</h2>
                <textarea id="notes" rows="2" style="width:100%; padding:10px; border-radius:10px; border:1px solid #ddd;" placeholder="Дополнительные наблюдения..."></textarea>
            </div>

            <div class="button-group">
                <button type="button" class="submit-btn" onclick="sendReport()">📤 Отправить отчет</button>
                <button type="button" class="cancel-btn" onclick="closeApp()">❌ Закрыть</button>
            </div>
        </form>
    </div>

    <script>
        const tg = Telegram.WebApp;
        tg.expand();
        tg.ready();
        
        const user = tg.initDataUnsafe?.user;
        
        // Дата за вчера
        const yesterday = new Date();
        yesterday.setDate(yesterday.getDate() - 1);
        document.getElementById('dateInfo').innerHTML = `📅 Отчет за: ${yesterday.toLocaleDateString('ru-RU')}`;
        
        function sendReport() {
            // Сбор данных
            const report = {
                user_id: user?.id,
                user_name: user?.first_name || 'Unknown',
                report_date: yesterday.toISOString().split('T')[0],
                timestamp: new Date().toISOString(),
                
                // Температура
                temperature: {
                    day: parseFloat(document.getElementById('temp_day').value) || null,
                    night: parseFloat(document.getElementById('temp_night').value) || null,
                    avg: parseFloat(document.getElementById('temp_avg').value) || null,
                    max: parseFloat(document.getElementById('temp_max').value) || null,
                    min: parseFloat(document.getElementById('temp_min').value) || null
                },
                
                // Влажность
                humidity: {
                    day: parseFloat(document.getElementById('hum_day').value) || null,
                    night: parseFloat(document.getElementById('hum_night').value) || null,
                    avg: parseFloat(document.getElementById('hum_avg').value) || null,
                    max: parseFloat(document.getElementById('hum_max').value) || null,
                    min: parseFloat(document.getElementById('hum_min').value) || null
                },
                
                // Клапаны
                valves: []
            };
            
            // Собираем данные по 4 клапанам
            for (let i = 1; i <= 4; i++) {
                report.valves.push({
                    valve_number: i,
                    ec: parseFloat(document.getElementById(`ec_${i}`).value) || null,
                    ph: parseFloat(document.getElementById(`ph_${i}`).value) || null,
                    drainage: parseFloat(document.getElementById(`drain_${i}`).value) || null
                });
            }
            
            report.notes = document.getElementById('notes').value || '';
            
            tg.sendData(JSON.stringify(report));
            tg.showAlert('✅ Отчет отправлен!');
            setTimeout(() => tg.close(), 1500);
        }
        
        function closeApp() {
            tg.close();
        }
        
        tg.MainButton.setText("ОТПРАВИТЬ ОТЧЕТ");
        tg.MainButton.onClick(sendReport);
        tg.MainButton.show();
    </script>
</body>
</html>
