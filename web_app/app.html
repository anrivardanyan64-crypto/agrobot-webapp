<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>AgroBot Monitoring PRO</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:-apple-system,system-ui,Segoe UI,Roboto,sans-serif; background:#f5f7fb; color:#1e2a3e; padding:16px 16px 90px; }
    .container { max-width:560px; margin:0 auto; }
    .section { background:#fff; border-radius:18px; padding:16px; margin-bottom:14px; border:1px solid #e7edf4; }
    h3 { margin-bottom:12px; font-size:17px; }
    .row { display:flex; gap:10px; flex-wrap:wrap; }
    input, textarea { width:100%; padding:11px 12px; border:1px solid #cfdfe8; border-radius:12px; font-size:15px; }
    .row input { flex:1; min-width:95px; }
    .valve-card { background:#f7fbf7; border-left:3px solid #4caf50; border-radius:12px; padding:12px; margin-bottom:10px; }
    button { width:100%; border:none; border-radius:24px; padding:13px; font-size:16px; font-weight:600; margin-top:10px; cursor:pointer; }
    .btn-add { background:#4caf50; color:#fff; }
    .btn-send { background:#2e7d32; color:#fff; }
    .btn-close { background:#94a3b8; color:#fff; }
    .hint { font-size:12px; color:#64748b; margin-top:8px; text-align:center; }
    .user { font-size:14px; color:#1e6f2f; background:#e9f7eb; padding:8px 12px; border-radius:999px; display:inline-block; }
  </style>
</head>
<body>
<div class="container">
  <div class="section" style="text-align:center;">
    <h2>🌾 Агро Мониторинг</h2>
    <div id="userInfo" class="user">⏳ Авторизация...</div>
  </div>

  <div class="section">
    <h3>🌡️ Температура (день / ночь / средняя / мин / макс)</h3>
    <div class="row">
      <input id="temp_day" type="number" step="0.1" placeholder="День">
      <input id="temp_night" type="number" step="0.1" placeholder="Ночь">
      <input id="temp_avg" type="number" step="0.1" placeholder="Средняя">
      <input id="temp_min" type="number" step="0.1" placeholder="Мин">
      <input id="temp_max" type="number" step="0.1" placeholder="Макс">
    </div>
  </div>

  <div class="section">
    <h3>💧 Влажность (день / ночь / средняя / мин / макс)</h3>
    <div class="row">
      <input id="hum_day" type="number" step="0.1" placeholder="День">
      <input id="hum_night" type="number" step="0.1" placeholder="Ночь">
      <input id="hum_avg" type="number" step="0.1" placeholder="Средняя">
      <input id="hum_min" type="number" step="0.1" placeholder="Мин">
      <input id="hum_max" type="number" step="0.1" placeholder="Макс">
    </div>
  </div>

  <div class="section">
    <h3>🚿 Клапаны <span id="valveCounter">3 / 10</span></h3>
    <div id="valvesContainer"></div>
    <!-- ВАЖНО: type="button", иначе ломает отправку -->
    <button id="addValveBtn" type="button" class="btn-add">➕ Добавить клапан +</button>
    <div class="hint">Введенные значения не стираются при добавлении</div>
  </div>

  <div class="section">
    <h3>📝 Заметки</h3>
    <textarea id="notes" rows="3" placeholder="Комментарий..."></textarea>
  </div>

  <button id="sendBtn" type="button" class="btn-send">📤 ОТПРАВИТЬ ОТЧЕТ</button>
  <button id="closeBtn" type="button" class="btn-close">🔒 ЗАКРЫТЬ</button>
</div>

<script>
  const tg = window.Telegram?.WebApp;
  if (tg) { tg.ready(); tg.expand(); }

  const user = tg?.initDataUnsafe?.user;
  document.getElementById('userInfo').textContent =
    user?.first_name ? `✅ ${user.first_name} ${user.last_name || ''} · ID: ${user.id || '—'}` : '⚠️ Откройте через Telegram-бота';

  let currentValvesCount = 3;
  const MAX_VALVES = 10;

  const valvesContainer = document.getElementById('valvesContainer');
  const addBtn = document.getElementById('addValveBtn');
  const valveCounter = document.getElementById('valveCounter');

  function createValveCard(i) {
    const card = document.createElement('div');
    card.className = 'valve-card';
    card.innerHTML = `
      <div style="margin-bottom:8px;font-weight:600;">🚰 Клапан ${i}</div>
      <div class="row">
        <input id="ec_${i}" type="number" step="0.1" placeholder="EC">
        <input id="ph_${i}" type="number" step="0.1" placeholder="pH">
        <input id="dr_${i}" type="number" step="0.1" placeholder="Дренаж %">
      </div>
    `;
    return card;
  }

  function snapshotValveValues() {
    const saved = {};
    for (let i = 1; i <= currentValvesCount; i++) {
      saved[i] = {
        ec: document.getElementById(`ec_${i}`)?.value || '',
        ph: document.getElementById(`ph_${i}`)?.value || '',
        dr: document.getElementById(`dr_${i}`)?.value || '',
      };
    }
    return saved;
  }

  function restoreValveValues(saved) {
    Object.keys(saved).forEach((k) => {
      const i = Number(k);
      const v = saved[i];
      const ec = document.getElementById(`ec_${i}`);
      const ph = document.getElementById(`ph_${i}`);
      const dr = document.getElementById(`dr_${i}`);
      if (ec) ec.value = v.ec;
      if (ph) ph.value = v.ph;
      if (dr) dr.value = v.dr;
    });
  }

  function renderValves() {
    const saved = snapshotValveValues();
    valvesContainer.innerHTML = '';
    for (let i = 1; i <= currentValvesCount; i++) valvesContainer.appendChild(createValveCard(i));
    restoreValveValues(saved);

    valveCounter.textContent = `${currentValvesCount} / ${MAX_VALVES}`;
    addBtn.disabled = currentValvesCount >= MAX_VALVES;
    addBtn.textContent = currentValvesCount >= MAX_VALVES ? '❌ Достигнут максимум (10)' : '➕ Добавить клапан +';
  }

  addBtn.addEventListener('click', (e) => {
    e.preventDefault();
    if (currentValvesCount < MAX_VALVES) {
      currentValvesCount++;
      renderValves();
    }
  });

  function collectValves() {
    const valves = [];
    for (let i = 1; i <= currentValvesCount; i++) {
      valves.push({
        id: i,
        ec: document.getElementById(`ec_${i}`)?.value || '',
        ph: document.getElementById(`ph_${i}`)?.value || '',
        drain_percent: document.getElementById(`dr_${i}`)?.value || '',
      });
    }
    return valves;
  }

  document.getElementById('sendBtn').addEventListener('click', (e) => {
    e.preventDefault();
    if (!tg) { alert('Откройте форму внутри Telegram.'); return; }

    const u = tg.initDataUnsafe?.user || {};
    const payload = {
      version: '4.1',
      timestamp: new Date().toISOString(),
      init_data: tg.initData || '',
      user: {
        id: u.id || null,
        name: `${u.first_name || 'Гость'} ${u.last_name || ''}`.trim(),
        username: u.username || null,
        raw: u
      },
      climate: {
        temperature: {
          day: document.getElementById('temp_day').value || '',
          night: document.getElementById('temp_night').value || '',
          avg: document.getElementById('temp_avg').value || '',
          min: document.getElementById('temp_min').value || '',
          max: document.getElementById('temp_max').value || ''
        },
        humidity: {
          day: document.getElementById('hum_day').value || '',
          night: document.getElementById('hum_night').value || '',
          avg: document.getElementById('hum_avg').value || '',
          min: document.getElementById('hum_min').value || '',
          max: document.getElementById('hum_max').value || ''
        }
      },
      valves: collectValves(),
      total_valves_count: currentValvesCount,
      notes: document.getElementById('notes').value || ''
    };

    try {
      tg.sendData(JSON.stringify(payload));
      tg.HapticFeedback?.notificationOccurred?.('success');
      setTimeout(() => tg.close(), 250);
    } catch (err) {
      console.error(err);
      alert('❌ Не удалось отправить отчет.');
    }
  });

  document.getElementById('closeBtn').addEventListener('click', (e) => {
    e.preventDefault();
    tg?.close?.();
  });

  renderValves();
</script>
</body>
</html>
