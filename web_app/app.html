<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: var(--tg-theme-bg-color, #f5f5f5);
            text-align: center;
        }
        .info {
            background: #e8f5e9;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
        }
        button {
            background: #4CAF50;
            color: white;
            padding: 15px 30px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            margin: 10px 0;
        }
        .error {
            background: #ffebee;
            color: #c62828;
        }
        input, select {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
        }
        .section {
            background: white;
            padding: 15px;
            border-radius: 10px;
            margin: 15px 0;
            text-align: left;
        }
    </style>
</head>
<body>
    <h1>🌱 Мониторинг теплицы</h1>
    
    <div class="info" id="status">
        ⏳ Проверка подключения...
    </div>
    
    <div id="userInfo" class="info" style="background: #e3f2fd;"></div>
    
    <form id="reportForm">
        <!-- Температура -->
        <div class="section">
            <h3>🌡️ Температура (°C)</h3>
            <input type="number" id="temp_day" placeholder="День" step="0.1">
            <input type="number" id="temp_night" placeholder="Ночь" step="0.1">
            <input type="number" id="temp_avg" placeholder="Средняя" step="0.1">
            <input type="number" id="temp_max" placeholder="Макс" step="0.1">
            <input type="number" id="temp_min" placeholder="Мин" step="0.1">
        </div>
        
        <!-- Влажность -->
        <div class="section">
            <h3>💧 Влажность (%)</h3>
            <input type="number" id="hum_day" placeholder="День">
            <input type="number" id="hum_night" placeholder="Ночь">
            <input type="number" id="hum_avg" placeholder="Средняя">
            <input type="number" id="hum_max" placeholder="Макс">
            <input type="number" id="hum_min" placeholder="Мин">
        </div>
        
        <!-- Клапан 1 -->
        <div class="section">
            <h3>🚰 Клапан 1</h3>
            <input type="number" id="ec_1" placeholder="EC (mS/cm)" step="0.1">
            <input type="number" id="ph_1" placeholder="pH" step="0.1">
            <input type="number" id="drain_1" placeholder="Дренаж %">
        </div>
        
        <!-- Клапан 2 -->
        <div class="section">
            <h3>🚰 Клапан 2</h3>
            <input type="number" id="ec_2" placeholder="EC (mS/cm)" step="0.1">
            <input type="number" id="ph_2" placeholder="pH" step="0.1">
            <input type="number" id="drain_2" placeholder="Дренаж %">
        </div>
        
        <!-- Клапан 3 -->
        <div class="section">
            <h3>🚰 Клапан 3</h3>
            <input type="number" id="ec_3" placeholder="EC (mS/cm)" step="0.1">
            <input type="number" id="ph_3" placeholder="pH" step="0.1">
            <input type="number" id="drain_3" placeholder="Дренаж %">
        </div>
        
        <!-- Клапан 4 -->
        <div class="section">
            <h3>🚰 Клапан 4</h3>
            <input type="number" id="ec_4" placeholder="EC (mS/cm)" step="0.1">
            <input type="number" id="ph_4" placeholder="pH" step="0.1">
            <input type="number" id="drain_4" placeholder="Дренаж %">
        </div>
        
        <div class="section">
            <h3>📝 Заметки</h3>
            <input type="text" id="notes" placeholder="Дополнительная информация...">
        </div>
    </form>
    
    <button onclick="sendReport()">📤 ОТПРАВИТЬ ОТЧЕТ</button>
    <button onclick="closeApp()" style="background:#f44336;">❌ ЗАКРЫТЬ</button>

    <script>
        // Инициализация
        const tg = Telegram.WebApp;
        tg.expand();
        tg.ready();
        
        const user = tg.initDataUnsafe?.user;
        const statusDiv = document.getElementById('status');
        const userInfoDiv = document.getElementById('userInfo');
        
        // Проверяем наличие пользователя
        if (user) {
            statusDiv.innerHTML = '✅ Web App работает!';
            statusDiv.className = 'info';
            userInfoDiv.innerHTML = `👤 Пользователь: ${user.first_name} (ID: ${user.id})<br>📊 Данные будут отправлены боту`;
        } else {
            statusDiv.innerHTML = '❌ ОШИБКА: Нет данных пользователя!\nПожалуйста, откройте приложение через кнопку в боте.';
            statusDiv.className = 'info error';
            userInfoDiv.innerHTML = '⚠️ Не удалось получить данные Telegram. Убедитесь, что вы открыли приложение через кнопку бота.';
        }
        
        // Функция отправки
        function sendReport() {
            if (!user) {
                tg.showAlert('Ошибка: Нет данных пользователя! Откройте приложение через кнопку в боте.');
                return;
            }
            
            // Собираем данные
            const reportData = {
                user_id: user.id,
                user_name: user.first_name,
                timestamp: new Date().toISOString(),
                
                temperature: {
                    day: parseFloat(document.getElementById('temp_day').value) || null,
                    night: parseFloat(document.getElementById('temp_night').value) || null,
                    avg: parseFloat(document.getElementById('temp_avg').value) || null,
                    max: parseFloat(document.getElementById('temp_max').value) || null,
                    min: parseFloat(document.getElementById('temp_min').value) || null
                },
                
                humidity: {
                    day: parseFloat(document.getElementById('hum_day').value) || null,
                    night: parseFloat(document.getElementById('hum_night').value) || null,
                    avg: parseFloat(document.getElementById('hum_avg').value) || null,
                    max: parseFloat(document.getElementById('hum_max').value) || null,
                    min: parseFloat(document.getElementById('hum_min').value) || null
                },
                
                valves: [
                    { valve: 1, ec: parseFloat(document.getElementById('ec_1').value) || null, ph: parseFloat(document.getElementById('ph_1').value) || null, drainage: parseFloat(document.getElementById('drain_1').value) || null },
                    { valve: 2, ec: parseFloat(document.getElementById('ec_2').value) || null, ph: parseFloat(document.getElementById('ph_2').value) || null, drainage: parseFloat(document.getElementById('drain_2').value) || null },
                    { valve: 3, ec: parseFloat(document.getElementById('ec_3').value) || null, ph: parseFloat(document.getElementById('ph_3').value) || null, drainage: parseFloat(document.getElementById('drain_3').value) || null },
                    { valve: 4, ec: parseFloat(document.getElementById('ec_4').value) || null, ph: parseFloat(document.getElementById('ph_4').value) || null, drainage: parseFloat(document.getElementById('drain_4').value) || null }
                ],
                
                notes: document.getElementById('notes').value || ''
            };
            
            console.log('Отправка данных:', reportData);
            
            try {
                // Отправляем данные
                tg.sendData(JSON.stringify(reportData));
                console.log('sendData выполнен');
                
                // Показываем успех
                tg.showAlert('✅ Отчет отправлен! Спасибо!');
                
                // Закрываем через 2 секунды
                setTimeout(() => {
                    tg.close();
                }, 2000);
                
            } catch (e) {
                console.error('Ошибка отправки:', e);
                tg.showAlert('❌ Ошибка: ' + e.message);
            }
        }
        
        function closeApp() {
            tg.close();
        }
        
        // Настройка Main Button
        tg.MainButton.setText("ОТПРАВИТЬ ОТЧЕТ");
        tg.MainButton.onClick(sendReport);
        tg.MainButton.show();
    </script>
</body>
</html>
