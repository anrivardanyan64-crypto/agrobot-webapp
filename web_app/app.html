<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AgroBot Monitoring</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, system-ui, sans-serif;
            background: var(--tg-theme-bg-color, #f5f5f5);
            color: var(--tg-theme-text-color, #000);
            padding: 16px; padding-bottom: 80px;
        }
        .container { max-width: 500px; margin: 0 auto; }
        .header {
            background: var(--tg-theme-secondary-bg-color, white);
            border-radius: 16px; padding: 16px; margin-bottom: 16px;
            text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .user-info {
            background: #e8f5e9; border-radius: 12px; padding: 10px;
            margin-top: 10px; font-size: 14px; color: #2e7d32;
        }
        .section {
            background: var(--tg-theme-secondary-bg-color, white);
            border-radius: 16px; padding: 16px; margin-bottom: 16px;
        }
        .section h3 { margin-bottom: 12px; border-left: 4px solid #4CAF50; padding-left: 10px; }
        .row { display: flex; gap: 8px; margin-bottom: 10px; }
        input, textarea {
            width: 100%; padding: 12px; border: 1px solid #ddd;
            border-radius: 12px; font-size: 16px;
            background: var(--tg-theme-bg-color, white);
            color: var(--tg-theme-text-color, #000);
        }
        .valve-card { background: rgba(0,0,0,0.03); border-radius: 12px; padding: 12px; margin-bottom: 10px; }
        .valve-title { font-weight: bold; color: #4CAF50; margin-bottom: 8px; }
        button {
            width: 100%; padding: 16px; border-radius: 14px; border: none;
            font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 10px;
        }
        .btn-primary { background: #4CAF50; color: white; }
        .btn-secondary { background: #777; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌱 Агро Мониторинг</h1>
            <div id="userInfo" class="user-info">⏳ Ожидание авторизации...</div>
        </div>

        <div class="section">
            <h3>🌡 Температура (°C)</h3>
            <div class="row">
                <input type="number" id="t_day" placeholder="День" step="0.1">
                <input type="number" id="t_night" placeholder="Ночь" step="0.1">
            </div>
        </div>

        <div class="section">
            <h3>💧 Влажность (%)</h3>
            <div class="row">
                <input type="number" id="h_day" placeholder="День">
                <input type="number" id="h_night" placeholder="Ночь">
            </div>
        </div>

        <div id="valvesContainer"></div>

        <div class="section">
            <h3>📝 Заметки</h3>
            <textarea id="notes" rows="2" placeholder="Ваши наблюдения..."></textarea>
        </div>

        <button class="btn-primary" id="sendBtn">📤 ОТПРАВИТЬ ОТЧЕТ</button>
        <button class="btn-secondary" id="closeBtn">ЗАКРЫТЬ</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        // 1. Отображение данных пользователя
        const userInfo = document.getElementById('userInfo');
        const user = tg.initDataUnsafe?.user;

        if (user) {
            userInfo.innerHTML = `✅ Доступ разрешен: ${user.first_name}`;
        } else {
            userInfo.innerHTML = `⚠️ Внимание: Откройте через кнопку бота!`;
            userInfo.style.background = "#ffebee";
            userInfo.style.color = "#c62828";
        }

        // 2. Генерация клапанов
        const container = document.getElementById('valvesContainer');
        for (let i = 1; i <= 4; i++) {
            const div = document.createElement('div');
            div.className = 'section';
            div.innerHTML = `
                <div class="valve-title">🚰 Клапан ${i}</div>
                <div class="row">
                    <input type="number" id="ec_${i}" placeholder="EC" step="0.1">
                    <input type="number" id="ph_${i}" placeholder="pH" step="0.1">
                    <input type="number" id="dr_${i}" placeholder="Дренаж %">
                </div>
            `;
            container.appendChild(div);
        }

        // 3. Функция отправки
        document.getElementById('sendBtn').onclick = function() {
            if (!tg.initDataUnsafe?.user) {
                alert("Ошибка: Запустите приложение через кнопку в боте Telegram!");
                return;
            }

            const data = {
                user_name: tg.initDataUnsafe.user.first_name,
                user_id: tg.initDataUnsafe.user.id,
                temp: { d: document.getElementById('t_day').value, n: document.getElementById('t_night').value },
                hum: { d: document.getElementById('h_day').value, n: document.getElementById('h_night').value },
                valves: [],
                notes: document.getElementById('notes').value
            };

            for (let i = 1; i <= 4; i++) {
                data.valves.push({
                    id: i,
                    ec: document.getElementById(`ec_${i}`).value,
                    ph: document.getElementById(`ph_${i}`).value,
                    dr: document.getElementById(`dr_${i}`).value
                });
            }

            tg.sendData(JSON.stringify(data));
        };

        document.getElementById('closeBtn').onclick = () => tg.close();
    </script>
</body>
</html>
