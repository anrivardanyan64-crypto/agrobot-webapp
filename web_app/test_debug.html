<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body style="padding: 20px; font-family: Arial; text-align: center;">
    <h1>🔍 ДИАГНОСТИКА WEB APP</h1>
    
    <div id="info" style="background: #f0f0f0; padding: 15px; border-radius: 10px; margin: 20px 0;"></div>
    
    <button onclick="sendTest()" style="background: #4CAF50; color: white; padding: 15px 30px; font-size: 18px; border: none; border-radius: 10px; cursor: pointer;">
        📤 ОТПРАВИТЬ ТЕСТ
    </button>
    
    <button onclick="closeApp()" style="background: #f44336; color: white; padding: 15px 30px; font-size: 18px; border: none; border-radius: 10px; cursor: pointer; margin-top: 10px;">
        ❌ ЗАКРЫТЬ
    </button>
    
    <script>
        const tg = Telegram.WebApp;
        tg.expand();
        tg.ready();
        
        const user = tg.initDataUnsafe?.user;
        const info = document.getElementById('info');
        
        // Проверяем, есть ли данные пользователя
        if (user) {
            info.innerHTML = `
                ✅ Telegram Web App РАБОТАЕТ!<br><br>
                👤 Имя: ${user.first_name} ${user.last_name || ''}<br>
                🆔 ID: ${user.id}<br>
                📊 initData: ${tg.initData ? 'есть' : 'нет'}<br>
                🔧 Версия: ${tg.version}<br><br>
                📌 Нажмите кнопку ниже, чтобы отправить тест боту
            `;
            info.style.background = "#e8f5e9";
        } else {
            info.innerHTML = `
                ❌ ОШИБКА: Нет данных о пользователе!<br><br>
                ⚠️ Веб-приложение открыто НЕ через Telegram.<br>
                Пожалуйста, откройте его через кнопку в боте.
            `;
            info.style.background = "#ffebee";
            info.style.color = "#c62828";
        }
        
        function sendTest() {
            if (!user) {
                tg.showAlert('Ошибка: Нет данных пользователя!');
                return;
            }
            
            const testData = {
                user_id: user.id,
                user_name: user.first_name,
                test: true,
                time: new Date().toISOString(),
                message: "Тестовое сообщение"
            };
            
            console.log('Отправка:', testData);
            tg.sendData(JSON.stringify(testData));
            tg.showAlert('✅ Тест отправлен! Проверьте бота');
            
            setTimeout(() => tg.close(), 1500);
        }
        
        function closeApp() {
            tg.close();
        }
    </script>
</body>
</html>
