<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #f5f5f5;
            padding: 20px;
            text-align: center;
        }
        .card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            margin: 20px 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        button {
            background: #4CAF50;
            color: white;
            padding: 16px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            width: 100%;
            cursor: pointer;
            margin: 10px 0;
        }
        .info {
            background: #e8f5e9;
            padding: 15px;
            border-radius: 12px;
            margin: 10px 0;
            font-size: 14px;
        }
        .error {
            background: #ffebee;
            color: #c62828;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <h1>📱 МОБИЛЬНЫЙ ТЕСТ</h1>
    
    <div class="card">
        <div id="status" class="info">⏳ Проверка...</div>
        <div id="userData" class="info"></div>
        
        <input type="text" id="testInput" placeholder="Тестовое сообщение">
        <button onclick="sendTest()">📤 ОТПРАВИТЬ ТЕСТ</button>
        <button onclick="closeApp()">❌ ЗАКРЫТЬ</button>
    </div>
    
    <script>
        // Инициализация Telegram
        const tg = Telegram.WebApp;
        tg.expand();
        tg.ready();
        
        const user = tg.initDataUnsafe?.user;
        const statusDiv = document.getElementById('status');
        const userDataDiv = document.getElementById('userData');
        
        // Проверяем наличие данных
        if (user) {
            statusDiv.innerHTML = '✅ Web App РАБОТАЕТ!';
            statusDiv.className = 'info';
            userDataDiv.innerHTML = `
                👤 Имя: ${user.first_name}<br>
                🆔 ID: ${user.id}<br>
                📱 Telegram версия: ${tg.version}<br>
                📊 initData: ${tg.initData ? 'есть' : 'нет'}
            `;
            userDataDiv.style.background = "#e8f5e9";
        } else {
            statusDiv.innerHTML = '❌ ОШИБКА: Нет пользователя!';
            statusDiv.className = 'info error';
            userDataDiv.innerHTML = '⚠️ Приложение открыто не через Telegram';
            userDataDiv.style.background = "#ffebee";
        }
        
        // Функция отправки
        function sendTest() {
            if (!user) {
                tg.showAlert('Ошибка: Нет данных пользователя!');
                return;
            }
            
            const testMessage = document.getElementById('testInput').value || 'Тест с телефона';
            
            const testData = {
                user_id: user.id,
                user_name: user.first_name,
                message: testMessage,
                time: new Date().toISOString(),
                phone_test: true
            };
            
            console.log('Отправка:', testData);
            
            // Отправляем
            tg.sendData(JSON.stringify(testData));
            
            // Показываем уведомление
            tg.showAlert('✅ Тест отправлен! Проверьте бота');
            
            // Закрываем через 2 секунды
            setTimeout(() => {
                tg.close();
            }, 2000);
        }
        
        function closeApp() {
            tg.close();
        }
        
        // Настраиваем Main Button
        tg.MainButton.setText("ОТПРАВИТЬ ТЕСТ");
        tg.MainButton.onClick(sendTest);
        tg.MainButton.show();
        
        console.log('Скрипт загружен, user:', user);
    </script>
</body>
</html>
